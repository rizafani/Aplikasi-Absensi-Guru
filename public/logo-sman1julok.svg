<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Curved path for SMA NEGERI 1 JULOK top arch -->
    <!-- Follows the angle of the pentagon top edges -->
    <path id="archTextPath" d="M 65 240 Q 250 80 435 240" fill="none" />
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- PENTAGON SHIELD (Yellow with Black Outlines) -->
  <!-- Outer Black Shield Edge -->
  <polygon 
    points="300,16 580,215 480,572 120,572 20,215" 
    fill="#FFE600" 
    stroke="#000000" 
    stroke-width="26" 
    stroke-linejoin="round"
  />

  <!-- Inner Thin Black Line border -->
  <polygon 
    points="300,38 558,220 464,550 136,550 42,220" 
    fill="none" 
    stroke="#000000" 
    stroke-width="5" 
    stroke-linejoin="round"
  />

  <!-- ARCH TEXT: SMA NEGERI 1 JULOK -->
  <!-- Top Left: SMA NEGERI -->
  <text 
    font-family="'Impact', 'Arial Black', sans-serif" 
    font-size="44" 
    font-weight="900" 
    fill="#000000" 
    letter-spacing="2"
  >
    <textPath href="#archTextPath" startOffset="50%" text-anchor="middle">
      SMA NEGERI 1 JULOK
    </textPath>
  </text>

  <!-- RENCONG DAGGER / SPEARHEAD (Center Top above book) -->
  <g id="rencong" transform="translate(300, 185)">
    <!-- Pointed Blade -->
    <path d="M 0 -60 L 9 -12 L 4 0 L -4 0 L -9 -12 Z" fill="#000000"/>
    <!-- Blade center hollow / line -->
    <path d="M 0 -54 L 0 -5" stroke="#FFE600" stroke-width="2.5"/>
    <!-- Tang / Handle join knot -->
    <polygon points="0,-1 6,7 0,15 -6,7" fill="#000000"/>
    <polygon points="0,2 3,7 0,12 -3,7" fill="#FFE600"/>
    <!-- Lower base pin -->
    <rect x="-2" y="15" width="4" height="12" fill="#000000"/>
  </g>

  <!-- OPEN BOOK (CENTER) -->
  <g id="open-book" transform="translate(300, 310)">
    <!-- Outer Black Cover / Shadow Base -->
    <path d="M 0 100 
             C 45 75, 100 85, 128 65 
             L 124 -65 
             C 95 -45, 45 -55, 0 -35 
             C -45 -55, -95 -45, -124 -65 
             L -128 65 
             C -100 85, -45 75, 0 100 Z" 
          fill="#000000"/>

    <!-- Left Main White Page block -->
    <path d="M -5 -30 
             C -45 -48, -90 -40, -118 -58 
             L -121 58 
             C -90 40, -45 48, -5 66 Z" 
          fill="#FFFFFF" stroke="#000000" stroke-width="4"/>

    <!-- Right Main White Page block -->
    <path d="M 5 -30 
             C 45 -48, 90 -40, 118 -58 
             L 121 58 
             C 90 40, 45 48, 5 66 Z" 
          fill="#FFFFFF" stroke="#000000" stroke-width="4"/>

    <!-- Book Spine center divider -->
    <path d="M 0 -32 L 0 95" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

    <!-- Left Page Horizontal Lines (Text representation) -->
    <path d="M -15 -12 C -45 -26, -80 -20, -108 -34" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <path d="M -15 6 C -45 -8, -80 -2, -108 -16" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <path d="M -15 24 C -45 10, -80 16, -108 2" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <path d="M -15 42 C -45 28, -80 34, -108 20" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

    <!-- Right Page Horizontal Lines -->
    <path d="M 15 -12 C 45 -26, 80 -20, 108 -34" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <path d="M 15 6 C 45 -8, 80 -2, 108 -16" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <path d="M 15 24 C 45 10, 80 16, 108 2" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <path d="M 15 42 C 45 28, 80 34, 108 20" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

    <!-- Additional page depth layers -->
    <path d="M -122 -52 L -122 62" stroke="#000000" stroke-width="3"/>
    <path d="M 122 -52 L 122 62" stroke="#000000" stroke-width="3"/>
  </g>

  <!-- COTTON BRANCH (KAPAS - LEFT SIDE) -->
  <g id="kapas-branch" transform="translate(135, 340)">
    <!-- Main curved green stalk -->
    <path d="M 55 75 Q -5 40 -15 -60 Q -20 -110 -5 -145" fill="none" stroke="#008037" stroke-width="15" stroke-linecap="round"/>

    <!-- Cotton Boll 1 (Top) -->
    <g transform="translate(-10, -135)">
      <!-- Green Calyx -->
      <path d="M -16 6 C -20 -8, -10 -18, 0 -22 C 10 -18, 20 -8, 16 6 Z" fill="#008037"/>
      <!-- White Cotton Flower (3 lobes) -->
      <path d="M 0 -22 C -18 -26, -30 2, -16 16 C -2 24, 2 24, 16 16 C 30 2, 18 -26, 0 -22 Z" 
            fill="#FFFFFF" stroke="#008037" stroke-width="4"/>
    </g>

    <!-- Cotton Boll 2 (Middle) -->
    <g transform="translate(-25, -60)">
      <!-- Green Calyx -->
      <path d="M -16 6 C -20 -8, -10 -18, 0 -22 C 10 -18, 20 -8, 16 6 Z" fill="#008037"/>
      <!-- White Cotton Flower -->
      <path d="M 0 -22 C -18 -26, -30 2, -16 16 C -2 24, 2 24, 16 16 C 30 2, 18 -26, 0 -22 Z" 
            fill="#FFFFFF" stroke="#008037" stroke-width="4"/>
    </g>

    <!-- Cotton Boll 3 (Bottom) -->
    <g transform="translate(-5, 15)">
      <!-- Green Calyx -->
      <path d="M -16 6 C -20 -8, -10 -18, 0 -22 C 10 -18, 20 -8, 16 6 Z" fill="#008037"/>
      <!-- White Cotton Flower -->
      <path d="M 0 -22 C -18 -26, -30 2, -16 16 C -2 24, 2 24, 16 16 C 30 2, 18 -26, 0 -22 Z" 
            fill="#FFFFFF" stroke="#008037" stroke-width="4"/>
    </g>
  </g>

  <!-- PALM / FERN LEAF BRANCH (RIGHT SIDE) -->
  <g id="leaf-branch" transform="translate(465, 335)">
    <!-- Main stem -->
    <path d="M -55 75 Q 5 20 20 -60 Q 30 -110 5 -150" fill="none" stroke="#008037" stroke-width="7" stroke-linecap="round"/>

    <!-- Leaflets (Daun menyirip ke atas) -->
    <!-- Top-most leaf -->
    <path d="M 5 -150 Q 15 -180 5 -200 Q -5 -170 5 -150 Z" fill="#008037"/>

    <!-- Pair 1 -->
    <path d="M 12 -130 Q 35 -160 30 -180 Q 15 -150 12 -130 Z" fill="#008037"/>
    <path d="M 0 -130 Q -25 -155 -35 -175 Q -20 -145 0 -130 Z" fill="#008037"/>

    <!-- Pair 2 -->
    <path d="M 18 -100 Q 55 -125 50 -150 Q 25 -120 18 -100 Z" fill="#008037"/>
    <path d="M 5 -100 Q -30 -120 -45 -140 Q -25 -110 5 -100 Z" fill="#008037"/>

    <!-- Pair 3 -->
    <path d="M 20 -70 Q 68 -90 65 -115 Q 35 -85 20 -70 Z" fill="#008037"/>
    <path d="M 8 -70 Q -32 -85 -52 -105 Q -28 -80 8 -70 Z" fill="#008037"/>

    <!-- Pair 4 -->
    <path d="M 18 -40 Q 72 -55 72 -80 Q 35 -50 18 -40 Z" fill="#008037"/>
    <path d="M 5 -40 Q -35 -50 -55 -70 Q -28 -45 5 -40 Z" fill="#008037"/>

    <!-- Pair 5 -->
    <path d="M 12 -10 Q 68 -20 70 -45 Q 30 -18 12 -10 Z" fill="#008037"/>
    <path d="M -2 -10 Q -35 -18 -52 -35 Q -25 -15 -2 -10 Z" fill="#008037"/>

    <!-- Pair 6 -->
    <path d="M 0 20 Q 55 15 58 -10 Q 25 10 0 20 Z" fill="#008037"/>
    <path d="M -15 20 Q -42 12 -55 -5 Q -30 15 -15 20 Z" fill="#008037"/>

    <!-- Pair 7 -->
    <path d="M -18 48 Q 35 48 38 25 Q 12 40 -18 48 Z" fill="#008037"/>
    <path d="M -30 48 Q -50 42 -58 25 Q -40 40 -30 48 Z" fill="#008037"/>
  </g>

  <!-- WHITE RIBBON BANNER (KAB. ACEH TIMUR) -->
  <g id="ribbon" transform="translate(300, 440)">
    <!-- Left Ribbon Tail / Fold -->
    <path d="M -130 5 L -190 -18 L -165 7 L -190 32 L -130 15 Z" fill="#FFFFFF" stroke="#000000" stroke-width="4.5"/>
    <path d="M -130 15 L -140 -5 L -130 -18 Z" fill="#C4C4C4" stroke="#000000" stroke-width="4"/>

    <!-- Right Ribbon Tail / Fold -->
    <path d="M 130 5 L 190 -18 L 165 7 L 190 32 L 130 15 Z" fill="#FFFFFF" stroke="#000000" stroke-width="4.5"/>
    <path d="M 130 15 L 140 -5 L 130 -18 Z" fill="#C4C4C4" stroke="#000000" stroke-width="4"/>

    <!-- Main Front Banner Rect with curved notches -->
    <path d="M -135 -24 
             L 135 -24 
             C 142 -24, 145 -18, 145 -5 
             L 145 15 
             C 145 25, 138 28, 130 28 
             L -130 28 
             C -138 28, -145 25, -145 15 
             L -145 -5 
             C -145 -18, -142 -24, -135 -24 Z" 
          fill="#FFFFFF" 
          stroke="#000000" 
          stroke-width="5"
    />

    <!-- Ribbon Text: KAB. ACEH TIMUR -->
    <text 
      y="11" 
      font-family="'Impact', 'Arial Black', sans-serif" 
      font-size="33" 
      font-weight="900" 
      fill="#000000" 
      text-anchor="middle" 
      letter-spacing="2"
    >
      KAB. ACEH TIMUR
    </text>
  </g>

  <!-- BOTTOM TEXT: PROVINSI ACEH -->
  <text 
    x="300" 
    y="525" 
    font-family="'Impact', 'Arial Black', sans-serif" 
    font-size="43" 
    font-weight="900" 
    fill="#000000" 
    text-anchor="middle" 
    letter-spacing="2.5"
  >
    PROVINSI ACEH
  </text>
</svg>
